# Read the Docs configuration for PIMMS.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Read the Docs checks the repo out as a SHALLOW clone. `git describe` then finds
      # no reachable tag, so versioningit reports the "0+unknown" default and the version
      # shown on the docs index page degrades to "unknown" (docs/conf.py reads the
      # version from the git tags - see the fallback chain there). Deepen the history and
      # make sure the tags are present so the real version resolves.
      #
      # --unshallow errors on an already-complete checkout (RTD sometimes reuses a cached
      # one), hence the fallbacks; a failure here must never fail the docs build.
      - git fetch --tags --unshallow || git fetch --tags || true

sphinx:
  configuration: docs/conf.py

# PIMMS' hot loops are compiled Cython extensions, and a few modules import heavy
# runtime dependencies (mdtraj, scipy, dateutil). These are mocked in docs/conf.py,
# so the documentation build does NOT compile the extensions or install the package
# itself - only the lightweight requirements below are needed.
python:
  install:
    - requirements: docs/requirements.txt
