# Read the Docs configuration for PIMMS.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# PIMMS' hot loops are compiled Cython extensions, and a few modules import heavy
# runtime dependencies (mdtraj, scipy, dateutil). These are mocked in docs/conf.py,
# so the documentation build does NOT compile the extensions or install the package
# itself - only the lightweight requirements below are needed.
python:
  install:
    - requirements: docs/requirements.txt
