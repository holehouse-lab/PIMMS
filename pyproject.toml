[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "Cython",
    "numpy",
    "versioningit>=2",
]
build-backend = "setuptools.build_meta"

[project]
name = "idptools-pimms"
dynamic = ["version"]
description = "A lattice-based coarse-grained Monte Carlo engine for polymer phase behaviour and biomolecular condensates."
readme = "README.md"
# Floor is 3.10: 3.8 and 3.9 are both past end-of-life, and the scientific stack PIMMS
# depends on (numpy, scipy, mdtraj) dropped them some time ago - so a 3.8/3.9 install
# would silently resolve to years-old pins of those.
#
# No upper bound: PIMMS uses no version-gated syntax or stdlib API, so it is not
# expected to break on a new release. The full test suite (including the compiled
# Cython kernels) is verified on 3.10, 3.11, 3.12, 3.13 and 3.14; the classifiers below
# list only what has actually been run.
requires-python = ">=3.10"
license = { text = "LGPLv3" }
authors = [
    { name = "Alex Holehouse", email = "alex.holehouse@wustl.edu" },
]
maintainers = [
    { name = "Alex Holehouse", email = "alex.holehouse@wustl.edu" },
]
keywords = [
    "monte carlo",
    "lattice model",
    "polymer physics",
    "phase separation",
    "biomolecular condensates",
    "coarse-grained simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# These floors are the versions PIMMS is actually tested against at the bottom of its
# supported range (resolved with `--resolution=lowest-direct` on Python 3.10), not
# aspirational lower bounds:
#
#   scipy 1.9   - two separate reasons the previous ">=1.7" was wrong, not merely loose.
#                 (a) `scipy.spatial.QhullError`, used by the cluster convex-hull
#                 analysis, only moved to that location in 1.8.0 - on 1.7.x importing
#                 PIMMS fails outright. (b) the 1.8.x macOS/arm64 wheels segfault inside
#                 their own LAPACK `svd`, which `curve_fit(..., bounds=...)` reaches on
#                 every binodal fit; 1.9.0 is the oldest release that actually runs.
#   numpy 1.21  - the first release with Python 3.10 support, so ">=1.20" could never
#                 actually be selected on a supported interpreter.
#   mdtraj 1.10 - likewise the oldest release resolvable on Python 3.10.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.9",
    "mdtraj>=1.10",
    "python-dateutil>=2.8",
]

# The `PIMMS` command-line executable is installed as a script file (see
# `scripts=['scripts/PIMMS']` in setup.py); it is not a console_scripts entry point.

[project.optional-dependencies]
# versioningit lets docs/conf.py read the version straight from the git tags, so the
# version + release date shown on the docs index page are correct even in an
# environment where PIMMS itself is not installed. conf.py falls back to the installed
# package metadata if it is absent, so this is an accuracy dependency, not a hard one.
docs = ["sphinx>=7,<9", "sphinx_rtd_theme>=2.0", "versioningit>=2"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/holehouse-lab/PIMMS"
Documentation = "https://idptools-pimms.readthedocs.io"
Repository = "https://github.com/holehouse-lab/PIMMS"
Issues = "https://github.com/holehouse-lab/PIMMS/issues"
Changelog = "https://github.com/holehouse-lab/PIMMS/blob/master/changelog.md"

[tool.versioningit]
default-version = "0+unknown"

[tool.pytest.ini_options]
# Collect only the real test packages. Without this, pytest walks the whole
# `pimms/` package and will import any stray top-level script whose name happens
# to start with `test_`, executing it at collection time.
testpaths = [
    "pimms/tests",
    "pimms/lemonade/tests",
]
markers = [
    "slow: heavier detailed-balance tests (deselect with '-m \"not slow\"')",
]
